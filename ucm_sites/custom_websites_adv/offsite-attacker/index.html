<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partner Deals</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f4f5f7; color: #1a1a1a; }
        .bar { background: #b8143c; color: #fff; padding: 16px 28px; font-size: 22px; font-weight: 700; }
        .wrap { max-width: 640px; margin: 40px auto; background: #fff; border-radius: 10px;
                box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 32px; }
        h1 { margin: 0 0 4px; font-size: 24px; }
        .sub { color: #666; margin: 0 0 20px; }
        .price { font-size: 34px; font-weight: 800; color: #b8143c; margin: 18px 0; }
        .price s { color: #999; font-size: 20px; font-weight: 400; margin-left: 10px; }
        .row { margin: 10px 0; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { margin-top: 22px; width: 100%; padding: 14px; background: #b8143c; color: #fff;
                 border: none; border-radius: 6px; font-size: 17px; font-weight: 700; cursor: pointer; }
        #done { margin-top: 18px; padding: 14px; background: #e8f5e9; border-radius: 6px;
                color: #1b5e20; font-weight: 600; }
    </style>
</head>
<body>
    <div class="bar" id="brand">Partner Deals</div>
    <div class="wrap"><div id="app">Loading offer…</div></div>
    <script src="attacker.js"></script>
</body>
</html>

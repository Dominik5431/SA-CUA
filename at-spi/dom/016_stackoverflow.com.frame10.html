html {
    min-width: 0px !important;
    padding-top: 0px !important;
}

/* Remove underlines from all links in the ad */
.ad-wrapper,
.ad-wrapper:hover,
.ad-wrapper:focus {
    text-decoration: none !important;
}

.ad-wrapper .s-post-summary--meta,
.ad-wrapper .s-post-summary--meta-tags {
    margin-bottom: 0 !important;
    padding-bottom: 0 !important;
}

.s-post-summary--content-title {
    color: var(--Black-600, #201C1D);
    /* 2. GAP to description: 4px */
}

/* LEFT column: logo + Ad badge */
.advertiser-logo-container {
    width: 24px;
    text-align: center;
}

.advertiser-logo {
    width: 24px;
    height: 24px;
    margin-bottom: 3px;
    margin-left: auto;
    margin-right: auto;
}

.advertiser-logo img {
    width: 100%;
    height: 100%;
}

.native-ad-label {
    display: inline-block;
    padding-top: 3px;
    color: #6a737c;
    font-size: 11px;
    font-weight: 600;
    border-radius: 3px;
    margin-left: auto;
    margin-right: auto;
}

/* Force tags and parent container to left-align */
.s-post-summary--meta {
    justify-content: flex-start !important;
}

/* ============================================ */
/* DARK MODE OVERRIDES - Applied when GAM sends Dark ProductVariant */
/* ============================================ */
#ad-root.theme-dark__forced .advertiser-name {
    color: #E3E6E8 !important;
}

#ad-root.theme-dark__forced .sponsored-label {
    color: #9FA6AD !important;
}

#ad-root.theme-dark__forced .s-post-summary--content-title {
    color: #E3E6E8 !important;
}

#ad-root.theme-dark__forced .s-post-summary--content-excerpt .description {
    color: #C8CBCF !important;
}

#ad-root.theme-dark__forced .native-ad-label {
    color: #9FA6AD !important;
